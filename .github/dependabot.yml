# NOTE: This project is migrating to Renovate (renovate.json)
# Dependabot will be deprecated after Renovate is fully validated
# See: https://github.com/renovatebot/renovate

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "vitest"
        versions: [">=4.0.0"]
        # Until @cloudflare/vitest-pool-workers supports vitest 4
    groups:
      production-dependencies:
        dependency-type: "production"
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "weekly"
