name = "matherlynet-tfstate"

# Set via environment variable: export CLOUDFLARE_ACCOUNT_ID="your-account-id"
# Or create a .env file with CLOUDFLARE_ACCOUNT_ID=your-account-id
compatibility_date = "2026-01-02" # 2024-04-03 or later required for RPC
compatibility_flags = ["nodejs_compat"]

main = "src/index.ts"

routes = [{ pattern = "tfstate.matherly.net", custom_domain = true }]

r2_buckets = [
    { binding = "TFSTATE_BUCKET", bucket_name = "matherlynet-tfstate" },
]

# Secrets are managed via:
# - Local dev: .dev.vars file (gitignored)
# - Production: wrangler secret put USERNAME && wrangler secret put PASSWORD

[durable_objects]
bindings = [{ name = "TFSTATE_LOCK", class_name = "DurableLock" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DurableLock"]
